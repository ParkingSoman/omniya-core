<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'">
    <title>Omniya test snapshot</title>
    <link rel="stylesheet" href="./inspect.css">
  </head>
  <body>
    <main class="inspector" aria-labelledby="snapshot-heading">
      <header class="inspector-header">
        <div>
          <p class="eyebrow">LOCAL TESTING</p>
          <h1 id="snapshot-heading">Latest Electron test snapshot</h1>
          <p id="snapshot-status" role="status" aria-live="polite">Loading snapshot…</p>
        </div>
        <button id="reload-snapshot" type="button">Reload snapshot</button>
      </header>

      <section aria-labelledby="screenshot-heading">
        <h2 id="screenshot-heading">Screenshot</h2>
        <img id="snapshot-image" alt="Final screenshot from the latest Electron test run" hidden>
      </section>

      <section aria-labelledby="aria-heading">
        <h2 id="aria-heading">Accessibility tree</h2>
        <pre id="snapshot-aria">Loading…</pre>
      </section>

      <section aria-labelledby="dom-heading">
        <h2 id="dom-heading">Captured main HTML</h2>
        <pre id="snapshot-html">Loading…</pre>
      </section>

      <section aria-labelledby="metadata-heading">
        <h2 id="metadata-heading">Run metadata</h2>
        <pre id="snapshot-metadata">Loading…</pre>
      </section>

      <p id="snapshot-error" class="error" role="alert" hidden></p>
    </main>
    <script type="module" src="./inspect.js"></script>
  </body>
</html>
