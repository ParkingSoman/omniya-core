name: Nemeth feature
description: A symbol, indicator or rule from the Nemeth Code that Omniya Core does not support yet.
title: "[nemeth] "
labels: ["nemeth"]
body:
  - type: markdown
    attributes:
      # Every field below carries a real label and a real description. Nothing
      # is explained by placeholder text alone: placeholders are not reliably
      # announced, and a form whose instructions only exist in grey text is a
      # form a screen-reader user fills in blind.
      value: |
        Use this form when the Nemeth Code has a symbol or rule that the app
        does not have yet.

        This is worked on by an agent, not held for a person. It looks the rule
        up in the Nemeth Code, writes a test that fails because the app cannot
        read it, and adds it. Then a comment on this issue gives you a link to a
        build you can install and try. You never need to leave this issue.

        If the build is still wrong, write a comment here that starts with
        @claude and say what you found. If it works, write @claude it works.
        The maintainer then reviews it and merges it.

        If you want the app to behave in a new way that the Nemeth Code does not
        settle, use the Design form instead.

  - type: input
    id: symbol
    attributes:
      label: The symbol or rule
      description: >-
        Its name in words. For example, "the infinity sign" or "the general
        omission sign".
    validations:
      required: true

  - type: textarea
    id: cells
    attributes:
      label: The braille cells
      description: >-
        The dots, in order. For example, "dot 6, then dots 1-2-3-4-5-6". If it
        has more than one form, give each one and say when it is used.
    validations:
      required: true

  - type: textarea
    id: reading
    attributes:
      label: What it means and how it should be read aloud
      description: >-
        What the symbol stands for. If you know how it should be spoken or
        shown, say so here, for example "read it as infinity". If you do not
        know, say that. The agent will choose a reading the Nemeth Code implies
        and tell you which one.
    validations:
      required: true

  - type: input
    id: code-section
    attributes:
      label: Where it is in the Nemeth Code (optional)
      description: >-
        The section or rule number, if you know it. Leave this empty if you do
        not. The agent looks it up either way.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ### Before you paste the diagnostics

        The diagnostics are optional here. If the app showed a message when you
        typed the symbol, they help.

        The dump contains what you typed: the mathematics, any other text in
        those fields, and your napkin names. Please read it and take out
        anything you would not want public, because this issue is public.
        Anyone on the internet can read it, and it stays readable after the
        feature is added.

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (optional)
      description: >-
        Open the Help menu and choose "Copy braille input diagnostics", then
        paste here.
      render: text
    validations:
      required: false
