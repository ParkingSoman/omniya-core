# Blank issues are OFF. Every report starts from one of four forms, and the form
# is how the pipeline knows what to do with it:
#
#   Bug report       an agent works on it           label `bug`
#   Nemeth or speech an agent works on it           label `nemeth`
#   Design           a person answers, no agent     label `design`
#   Other            a person answers, no agent     label `other`
#
# Blank issues used to stay on, so a feature request had somewhere to go. The
# Design and Other forms are that place now. A blank issue has no label to read,
# so it would be taken for a bug, which is the one input that wastes an agent run.
# `scripts/ci/issue-kind.mjs` still treats an issue with no type label as a bug,
# for the reports that were filed before there were types.
blank_issues_enabled: false
