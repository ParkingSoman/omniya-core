name: Design
description: A new feature, or a change to how Omniya Core looks, sounds or behaves.
title: "[design] "
labels: ["design"]
body:
  - type: markdown
    attributes:
      # Every field below carries a real label and a real description. Nothing
      # is explained by placeholder text alone. See `bug-report.yml`.
      value: |
        Use this form for something new, or a change to how the app looks,
        sounds or behaves.

        No agent starts on this. A person reads it and answers here, and may
        talk it through with you first. That is on purpose. A choice about how
        the app should feel is not one to make automatically.

        If a symbol or rule from the Nemeth Code is missing, use the Nemeth
        feature form. If something the app says it does is broken, use the Bug
        report form.

  - type: textarea
    id: what
    attributes:
      label: What you would like
      description: >-
        What the app should do or how it should feel. Say what you do now, and
        what you would do instead.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why it would help
      description: >-
        What is hard or slow today. If you have tried another tool that does this
        well, say which one and what it does.
    validations:
      required: true
