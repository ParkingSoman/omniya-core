name: Other
description: Anything that is not a bug, a missing Nemeth symbol or a design idea.
title: "[other] "
labels: ["other"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for anything else, such as a question or a note.

        No agent starts on this. A person reads it and answers here.

        If something is broken, use the Bug report form. If a symbol or rule from
        the Nemeth Code is missing, use the Nemeth feature form. If you want
        something new, use the Design form.

  - type: textarea
    id: what
    attributes:
      label: What you want to tell us
      description: Write it however is comfortable. Sentences are fine and so is a list.
    validations:
      required: true
