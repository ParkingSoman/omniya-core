name: pipeline-signoff

# Closing the issue does NOT merge anything any more.
#
# It used to. The contributor closed the issue and this merged the fix into
# `testing`, with no one else looking. That put the whole decision on the person
# least able to judge whether a change is safe for everybody: she can say the bug
# is gone on her own machine, and nothing more. The maintainer now merges, and
# the sign-off is a comment on the issue ("@claude it works"), which
# `pipeline-followup.yml` turns into a pull request ready for review.
#
# What is left here is one sentence of help. A contributor who closes an issue
# that still has a fix in progress would otherwise believe she had shipped it.
# So if an open fix claims this issue, the issue gets one comment saying what
# closing did not do and what to write instead. If no fix is open, nothing is
# said: that is the ordinary case of the maintainer's merge closing the issue,
# or of somebody tidying a stale report.
#
# It holds no secret and starts no agent, so a stranger closing their own issue
# costs nothing and needs no allowlist.
on:
  issues:
    types: [closed]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  explain:
    # Not for an issue closed as "not planned".
    if: github.event.issue.state_reason != 'not_planned'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/ci/find-fix-pr.mjs "$ISSUE_NUMBER"
      - if: steps.find.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "You closed this issue, but the fix is not finished. Closing does not send it to the maintainer. If it works for you, open this issue again and write: @claude it works. If it is still wrong, open it again and write @claude and say what you found."
