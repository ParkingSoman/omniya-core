name: contributor-fix

# A STUB. Copy this file to `.github/workflows/` on `main` and leave it there.
#
# GitHub starts an `on: issues` workflow from the DEFAULT branch's copy only, so
# the trigger has to be on `main`. The work is not. This file only calls
# `pipeline-fix.yml` on `testing`, so changing what the pipeline does is an
# ordinary pull request into `testing` and never touches `main`.
#
# It is deliberately too small to need changing. No logic belongs here: a test
# fails if a step, a script, or a second job is added.
on:
  issues:
    types: [opened]
  # Run it by hand for an issue that was missed: Actions tab, `contributor-fix`,
  # "Run workflow", type the issue number.
  workflow_dispatch:
    inputs:
      issue_number:
        description: Number of the issue to work on
        required: true
        type: string

jobs:
  call:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ParkingSoman/omniya-core/.github/workflows/pipeline-fix.yml@testing
    with:
      issue_number: ${{ github.event.inputs.issue_number || '' }}
    secrets: inherit
