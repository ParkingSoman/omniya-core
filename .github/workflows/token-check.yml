name: token-check

# TEMPORARY. Delete this once the fix pipeline is known to authenticate.
#
# `contributor-fix.yml` failed on its first two real reports in about two
# seconds each, with `num_turns: 1`, `is_error: true` and `modelUsage: {}`.
# Zero tokens means the model was never reached, so the cause is the credential
# and not the prompt. The action prints "Running Claude Code via SDK (full
# output hidden for security)", so the message that would name the cause never
# reaches the log.
#
# This runs the CLI directly with the same secret and prints what it says.
# It asks for one word, so nothing about the repository is exposed by the
# output. GitHub masks the secret itself in logs.
on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install the Claude Code CLI
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Ask for one word, and print whatever comes back
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -o pipefail
          # `set -e` is deliberately NOT on. A non-zero exit here is the answer,
          # not an accident, and the point of this job is to see the message
          # that comes with it.
          "$HOME/.local/bin/claude" -p "Reply with the single word OK and nothing else." \
            --max-turns 1 --output-format json 2>&1 | tee result.json
          status=$?
          echo "claude exit status: $status"
          exit $status
