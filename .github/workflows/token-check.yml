name: token-check

# TEMPORARY. Delete this once the fix pipeline is known to authenticate.
#
# `contributor-fix.yml` failed on both of its first real reports in about two
# seconds each, with `num_turns: 1`, `is_error: true` and `modelUsage: {}`.
# Zero tokens means the model was never reached. This job ran the CLI directly
# with the same secret and got the message the action hides:
#
#   "api_error_status": 401
#   "result": "Failed to authenticate. API Error: 401 Invalid bearer token"
#
# That was still true after the secret was replaced, so the next question is
# what kind of value is actually stored. The first step below answers that
# WITHOUT printing the secret: it reports the length and which known prefix it
# carries, nothing more. A subscription token from `claude setup-token` begins
# `sk-ant-oat01-`; an API key begins `sk-ant-api03-`. Those two are not
# interchangeable, and pasting one where the other belongs gives exactly this
# 401.
on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Say what shape the stored value is, without printing it
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then echo "shape: EMPTY"; exit 0; fi
          echo "length: ${#TOKEN}"
          case "$TOKEN" in
            sk-ant-oat01-*) echo "shape: subscription token (sk-ant-oat01-), which is the right kind" ;;
            sk-ant-api03-*) echo "shape: API KEY (sk-ant-api03-), which is the WRONG kind for this input" ;;
            sk-ant-*)       echo "shape: some other sk-ant- credential" ;;
            *)              echo "shape: does not start with sk-ant- at all" ;;
          esac
          # Whitespace is the other common cause: a copied line often carries a
          # trailing newline, and the API rejects the token with it attached.
          case "$TOKEN" in
            *[[:space:]]*) echo "whitespace: PRESENT somewhere in the value" ;;
            *)             echo "whitespace: none" ;;
          esac
          # If stripping whitespace makes the prefix appear, the stored value IS
          # the right token and the paste simply carried a newline. That is a
          # different fix from "the wrong thing was pasted", so it is worth
          # separating rather than guessing between them.
          TRIMMED=$(printf '%s' "$TOKEN" | tr -d '[:space:]')
          echo "trimmed length: ${#TRIMMED}"
          case "$TRIMMED" in
            sk-ant-oat01-*) echo "trimmed shape: subscription token. Right value, whitespace is the only problem." ;;
            sk-ant-api03-*) echo "trimmed shape: API KEY, the wrong kind for this input" ;;
            sk-ant-*)       echo "trimmed shape: some other sk-ant- credential" ;;
            *)              echo "trimmed shape: still not an sk-ant- credential. The wrong value is stored." ;;
          esac

      - name: Install the Claude Code CLI
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Ask for one word, and print whatever comes back
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -o pipefail
          # `set -e` is deliberately NOT on. A non-zero exit here is the answer,
          # not an accident, and the point of this job is to see the message
          # that comes with it.
          "$HOME/.local/bin/claude" -p "Reply with the single word OK and nothing else." \
            --max-turns 1 --output-format json 2>&1 | tee result.json
          status=$?
          echo "claude exit status: $status"
          exit $status
