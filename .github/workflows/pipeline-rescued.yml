name: pipeline-rescued

# A person rescued a fix the pipeline gave up on. Tell the contributor.
#
# `pipeline-verify.yml` posts "the maintainer needs to look" when the checks stay
# red after three repairs. When a person then fixes it, nothing told the
# contributor the build was back, and the only way to say so was to write a
# comment by hand. The owner does not touch GitHub, so this does it.
#
# It runs when the checks or the build of a fix branch finish. The script
# (`scripts/ci/tell-rescued.mjs`) says something only when the pull request is
# still marked as waiting on a person, the contributor's newest message from the
# pipeline is that wait, and the checks AND the build of the current commit both
# passed. Otherwise it says nothing and exits.
#
# No agent, no secret, and the code it reacts to is never checked out: this
# workflow runs from `testing`, and the branch name is passed through `env` only.
on:
  workflow_run:
    workflows: [pr-checks, pr-build]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  tell:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'claude/fix-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The checks and the build finish at about the same time. One run at a time
    # per branch, and none dropped: the second one finds the first already spoke.
    concurrency:
      group: pipeline-rescued-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: node scripts/ci/tell-rescued.mjs "$BRANCH"
