name: pipeline-followup

# Round two, and every round after it, on the ISSUE.
#
# `pipeline-fix.yml` turns one bug report into one draft pull request, and
# `pipeline-verify.yml` turns that into a checked build with links on the issue.
# If the build is still wrong, the contributor says what, in a comment on the
# SAME issue, and the agent revises the SAME branch. The build behind the
# existing links is replaced.
#
# The contributor never opens the pull request. It is the maintainer's
# material. Everything she reads and writes is on the issue.
#
# Called from the stub on `main` (`.github/pipeline-stubs/contributor-followup.yml`),
# for the same reason as `pipeline-fix.yml`: GitHub starts an `on: issue_comment`
# workflow from the default branch only.
#
# What the agent answers, as one word the jobs below act on:
#
#   revised      it changed the branch   -> verify, then ONE comment with the new build
#   approved     "it works"              -> hand the fix to the maintainer
#   answered     a question               -> ONE comment, the agent's answer
#   needs-design a request for something new -> ONE comment, and the label
#   blocked      a gate stays red, or the pull request will not open
#                                         -> ONE comment saying which, and the label
#   (a crash)    the agent job failed     -> `failed` tells the contributor
#
# The agent posts nothing itself. It leaves its words in a file, and the jobs
# below put them inside the one comment the contributor's comment gets. A
# contributor who writes `@claude` therefore hears one reply, and every reply is
# new. There is no "I am changing the fix" comment in between: their own comment
# started the round, and the next thing they hear is the result.
on:
  workflow_call:
    # Only the subscription token, and the stub passes only that. Not every
    # secret in the repository, and not `inherit`.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

# One run per issue, and the SAME group as `pipeline-fix.yml`, so a comment that
# arrives while a fix or a repair is running waits for it. They push to the same
# branch. Queued rather than cancelled, for a sharper reason than on the first
# round: a killed run can leave half a revision on the branch the contributor is
# downloading builds from.
concurrency:
  group: contributor-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # The gate, and it is doing four separate jobs at once. Read the `if` before
  # the steps: the steps never run for most comments in this repository, and
  # that is the point.
  allowlist:
    # 1. `github.event.issue.pull_request` exists only when the comment is on a
    #    pull request. GitHub sends issue comments and pull request comments
    #    through the same event, and this field is the only thing that tells
    #    them apart. The contributor writes on the ISSUE. A comment on a pull
    #    request is the maintainer's conversation and does not start a run.
    #
    # 2. `@claude` is what makes this cost anything. Without it every "thanks,
    #    I'll test tonight" would spend a run of somebody's subscription. The
    #    cost of the word is that forgetting it looks like being ignored, which
    #    is why the status comment on the issue says it every time.
    #
    # 3. The actor is not a Bot. The status comment and the agent's own comments
    #    are written by `github-actions[bot]`, and one of them quotes `@claude`.
    #    Without this line the status comment would start a run, which would
    #    comment, which would start a run. `isAllowed` in the allowlist script
    #    refuses `*[bot]` too -- this is the same rule said one step earlier, so
    #    the loop is cut before a runner is even claimed.
    #
    # 4. The comment is not one of the pipeline's own. Its status comment and its
    #    notice both tell the contributor to write `@claude`, and both carry a
    #    hidden `<!-- omniya-pipeline-` marker. A bot posts them, so rule 3 already
    #    skips them. But two of them were once posted by hand under the
    #    maintainer's name, which is a person, and each started an agent run that
    #    answered a comment nobody had written. The marker holds whoever posts it.
    #
    # 5. (the steps) There is exactly one open fix for this issue. Found below.
    if: >-
      !github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.comment.body, '@claude') &&
      !contains(github.event.comment.body, '<!-- omniya-pipeline-')
    runs-on: ubuntu-latest
    # Least privilege. This job only reads the allowlist and the pull request
    # list. It runs no agent and writes nothing.
    permissions:
      contents: read
      pull-requests: read
      # To read the labels and the agent's own earlier questions on the issue.
      issues: read
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
      access: ${{ steps.access.outputs.access }}
      number: ${{ steps.issue.outputs.number }}
      count: ${{ steps.find.outputs.count }}
      pr: ${{ steps.find.outputs.pr }}
      branch: ${{ steps.find.outputs.branch }}
      kind: ${{ steps.kind.outputs.kind }}
      owner: ${{ steps.owner.outputs.owner }}
      owner_comment_id: ${{ steps.owner.outputs.comment_id }}
      owner_comment_updated_at: ${{ steps.owner.outputs.comment_updated_at }}
      resume: ${{ steps.resume.outputs.resume }}
      question_round: ${{ steps.resume.outputs.question_round }}
    steps:
      - uses: actions/checkout@v4
      - id: issue
        env:
          # Safe to interpolate: GitHub guarantees the issue number is an
          # integer. Nothing else from the event is.
          NUMBER: ${{ github.event.issue.number }}
        run: echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
      - id: check
        # Through `env`, never straight into the command line, and deliberately
        # before any `npm ci`: the decision about whether to spend somebody's
        # subscription quota should not wait on an install that can fail.
        # `|| true` is on the step, not on the decision -- the script exits
        # non-zero to refuse and carries the refusal in the `allowed` output, so
        # a stranger commenting does not paint the Actions tab red.
        env:
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        run: node scripts/ci/allowlist.mjs "$COMMENT_AUTHOR" --github || true
      # Being on the list is not enough: `claude-code-action` refuses any actor
      # who cannot write to the repository (issue #33). Check the same actor, and
      # say the true reason. The script is not on `main`, so it comes out of
      # `testing`. `unknown` lets the run go on: the action checks again.
      - id: access
        if: steps.check.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin testing
          mkdir -p "$RUNNER_TEMP/access"
          for f in gh.mjs can-run-agent.mjs; do
            git show "origin/testing:scripts/ci/$f" > "$RUNNER_TEMP/access/$f"
          done
          node "$RUNNER_TEMP/access/can-run-agent.mjs" "$ACTOR"
      # Which pull request is this issue's fix? The default checkout is `main`,
      # which does not have the helper, so it comes out of `testing`.
      - id: find
        if: steps.check.outputs.allowed == 'true' && steps.access.outputs.access != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin testing
          mkdir -p "$RUNNER_TEMP/find"
          for f in gh.mjs find-fix-pr.mjs; do
            git show "origin/testing:scripts/ci/$f" > "$RUNNER_TEMP/find/$f"
          done
          node "$RUNNER_TEMP/find/find-fix-pr.mjs" "$ISSUE_NUMBER"
      # From the labels the form set, so the agent reads the follow-up the way it
      # read the report. The agent jobs below map `routed` to `bug`: a report that
      # was routed to a person has no fix to continue, and `nofix` answers it.
      - id: kind
        if: steps.check.outputs.allowed == 'true' && steps.access.outputs.access != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/find"
          # If the labels cannot be read, `bug`. See the same step in `pipeline-fix.yml`.
          { git show origin/testing:scripts/ci/issue-kind.mjs > "$RUNNER_TEMP/find/issue-kind.mjs" \
            && git show origin/testing:scripts/ci/gh.mjs > "$RUNNER_TEMP/find/gh.mjs" \
            && node "$RUNNER_TEMP/find/issue-kind.mjs" "$ISSUE_NUMBER"; } \
            || echo "kind=bug" >> "$GITHUB_OUTPUT"
      # Did the OWNER of the repository write this comment? GitHub fills in
      # `author_association` from the repository itself, so nobody can claim it
      # in the text of a comment. It is the one thing that can say "yes, do this
      # design idea": a design decision is the owner's, and an `@claude` from a
      # contributor, however firm, is a request. Issue #73 is why this exists:
      # the owner wrote "start a fix" on a design idea and was told there was no
      # fix in progress, with no way to say yes.
      - id: owner
        if: steps.check.outputs.allowed == 'true'
        env:
          ASSOCIATION: ${{ github.event.comment.author_association }}
          # An integer GitHub assigns. The approval is THIS comment, so a comment
          # a contributor adds while the run waits in the queue is not covered.
          COMMENT_ID: ${{ github.event.comment.id }}
          # When the text was last changed, as the event saw it. An edit made later
          # is not the text the owner wrote, and voids the approval.
          COMMENT_AT: ${{ github.event.comment.updated_at }}
        run: |
          owner=false
          comment_id=
          comment_at=
          if [ "$ASSOCIATION" = "OWNER" ]; then owner=true; comment_id=$COMMENT_ID; comment_at=$COMMENT_AT; fi
          {
            echo "owner=$owner"
            echo "comment_id=$comment_id"
            echo "comment_updated_at=$comment_at"
          } >> "$GITHUB_OUTPUT"
      # No fix yet, and the agent asked a question. This comment may be the
      # answer. It is one only when the issue carries `needs-info`, which the
      # pipeline puts there when the agent asks and takes off when it resumes.
      # The number of questions already asked is how many comments of the agent
      # start with the question marker, counted from GitHub and not from the
      # comment, so nobody can reset the cap by writing text.
      - id: resume
        if: steps.check.outputs.allowed == 'true' && steps.access.outputs.access != 'false' && steps.find.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          REPO: ${{ github.repository }}
          IS_OWNER: ${{ steps.owner.outputs.owner }}
        run: |
          set -euo pipefail
          labels="$(gh api "repos/$REPO/issues/$ISSUE_NUMBER" --jq '[.labels[].name] | join(",")')"
          asked="$(gh api "repos/$REPO/issues/$ISSUE_NUMBER/comments" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- omniya-pipeline-question -->")))] | length' \
            | awk '{ n += $1 } END { print n + 0 }')"
          # The OWNER of the repository says go ahead, and that is enough. It is
          # decided first and from `author_association`, which GitHub sets, so no
          # label and no wording of a comment can fake it. It works on a design
          # idea (`design`, `needs-design`) and on an issue nothing is waiting on.
          #
          # For everybody else, three things must all be true, and none of them is the contributor's
          # word. A person with write access can add a label by hand, so the label
          # alone proves nothing: there must also be a question the agent really
          # asked (a comment by the bot, counted above). And an issue the agent
          # labelled `needs-design` is the maintainer's to decide. Nobody on the
          # contributor list can restart it by writing `@claude` or by adding
          # `needs-info`. Only the maintainer can, by starting `contributor-fix`
          # by hand.
          resume=false
          if [ "$IS_OWNER" = "true" ]; then
            resume=true
          else
            case ",$labels," in
              *,needs-design,*) ;;
              *,needs-info,*) [ "${asked:-0}" -ge 1 ] && resume=true ;;
            esac
          fi
          echo "resume=$resume" >> "$GITHUB_OUTPUT"
          echo "question_round=${asked:-0}" >> "$GITHUB_OUTPUT"

  # The maintainer has to finish adding a listed contributor. Same reason as the
  # job of the same name in `pipeline-fix.yml`, and it fails for the same reason.
  noaccess:
    needs: allowlist
    if: needs.allowlist.outputs.allowed == 'true' && needs.allowlist.outputs.access == 'false'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.allowlist.outputs.number }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          gh label create needs-maintainer --force --description "A person has to look at this" || true
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label needs-maintainer
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Thank you for the comment. I did not start, because the maintainer has not finished adding you yet. Nothing is wrong with your comment. The maintainer has been told. Write to me again after that. You do not need to do anything else."
          {
            echo "### The fixer did not start on #$ISSUE_NUMBER"
            echo
            echo "$ACTOR is on the contributor list but cannot write to the repository. The agent action refuses that."
            echo "Run: node scripts/ci/add-contributor.mjs $ACTOR"
            echo "Then they must accept the invitation."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$ACTOR cannot write to the repository. See the job summary." >&2
          exit 1

  # A listed contributor wrote `@claude` and there is no fix to continue. Say so.
  # Silence is the failure this repository has already had once. Not when the
  # comment is the answer to a question: `resume` below handles that.
  nofix:
    needs: allowlist
    if: >-
      needs.allowlist.outputs.allowed == 'true' &&
      needs.allowlist.outputs.access != 'false' &&
      needs.allowlist.outputs.count != '1' &&
      needs.allowlist.outputs.resume != 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.allowlist.outputs.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Thank you for the comment. I did not start, because I could not find exactly one fix in progress for this report. The maintainer will read your comment."

  agent:
    needs: allowlist
    if: >-
      needs.allowlist.outputs.allowed == 'true' &&
      needs.allowlist.outputs.access != 'false' &&
      needs.allowlist.outputs.count == '1'
    # Without `actions`: the agent runs unrestricted Bash. Starting the checks
    # is the `verify` job below, which runs no agent.
    #
    # Without `issues: write` either. The agent posts nothing on the issue, and
    # this is what makes that true rather than requested.
    permissions:
      contents: write
      pull-requests: write
      issues: read
    uses: ParkingSoman/omniya-core/.github/workflows/pipeline-agent.yml@testing
    with:
      mode: comment
      kind: ${{ needs.allowlist.outputs.kind == 'nemeth' && 'nemeth' || 'bug' }}
      issue_number: ${{ needs.allowlist.outputs.number }}
      pr_number: ${{ needs.allowlist.outputs.pr }}
      branch: ${{ needs.allowlist.outputs.branch }}
      owner_comment_id: ${{ needs.allowlist.outputs.owner_comment_id }}
      owner_comment_updated_at: ${{ needs.allowlist.outputs.owner_comment_updated_at }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # The agent answered, refused as design, or is blocked. It wrote words for the
  # contributor and did not post them. Post them, once. A `blocked` or a design
  # refusal also gets its label here, because the agent labels nothing.
  reply:
    needs: [allowlist, agent]
    if: >-
      ${{ !cancelled() &&
      (needs.agent.outputs.result == 'answered' ||
      needs.agent.outputs.result == 'needs-design' ||
      needs.agent.outputs.result == 'blocked') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.allowlist.outputs.number }}
          RESULT: ${{ needs.agent.outputs.result }}
          # Agent text. It reaches the script through `env` only.
          MESSAGE: ${{ needs.agent.outputs.message }}
        run: |
          set -euo pipefail
          case "$RESULT" in
            needs-design) STATE=design ;;
            blocked) STATE=stuck ;;
            *) STATE=answered ;;
          esac
          node scripts/ci/reply.mjs "$ISSUE" "$STATE"

  # The contributor answered a question the agent asked. There is no pull request
  # yet, so this is the first round again, with the answer in front of the agent.
  # The label comes off first, so a second comment while this runs is not taken
  # for another answer. Then the one short "I started on this" comment goes back
  # on the issue, because the contributor has not heard anything since the
  # question.
  resume-start:
    needs: allowlist
    if: >-
      needs.allowlist.outputs.allowed == 'true' &&
      needs.allowlist.outputs.access != 'false' &&
      needs.allowlist.outputs.count == '0' &&
      needs.allowlist.outputs.resume == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.allowlist.outputs.number }}
        run: |
          set -euo pipefail
          # Both come off: `needs-info` says the agent is waiting for an answer, and
          # `needs-design` says it is waiting for the owner. A label that is not on
          # the issue must not fail the start, so each is allowed to be missing.
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label needs-info || true
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label needs-design || true
          node scripts/ci/reply.mjs "$ISSUE" started

  resume:
    needs: [allowlist, resume-start]
    if: needs.resume-start.result == 'success'
    # Without `actions`, for the same reason as `agent` above. And `issues: read`,
    # for the same reason too.
    permissions:
      contents: write
      pull-requests: write
      issues: read
    uses: ParkingSoman/omniya-core/.github/workflows/pipeline-agent.yml@testing
    with:
      mode: fix
      kind: ${{ needs.allowlist.outputs.kind == 'nemeth' && 'nemeth' || 'bug' }}
      issue_number: ${{ needs.allowlist.outputs.number }}
      question_round: ${{ needs.allowlist.outputs.question_round }}
      owner_comment_id: ${{ needs.allowlist.outputs.owner_comment_id }}
      owner_comment_updated_at: ${{ needs.allowlist.outputs.owner_comment_updated_at }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # What `outcome` does in `pipeline-fix.yml`: the agent asked again, is blocked, or
  # crashed, and the contributor has to be told.
  resume-outcome:
    needs: [allowlist, resume]
    if: >-
      ${{ !cancelled() &&
      needs.resume.result != 'skipped' &&
      (needs.resume.result != 'success' ||
      needs.resume.outputs.result == 'asked' ||
      needs.resume.outputs.result == 'needs-design' ||
      needs.resume.outputs.result == 'blocked') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.allowlist.outputs.number }}
          RESULT: ${{ needs.resume.outputs.result }}
          FIX_JOB: ${{ needs.resume.result }}
          # Agent text. It reaches the script through `env` only.
          MESSAGE: ${{ needs.resume.outputs.message }}
        run: node scripts/ci/fix-outcome.mjs "$ISSUE" "$FIX_JOB" "$RESULT"

  # The answer was enough, and the agent opened the pull request. From here it is
  # the same as a first round.
  resume-verify:
    needs: [allowlist, resume]
    if: needs.resume.outputs.result == 'opened'
    # A ceiling, not a grant: every job inside states its own permissions.
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: write
    uses: ParkingSoman/omniya-core/.github/workflows/pipeline-verify.yml@testing
    with:
      issue_number: ${{ needs.allowlist.outputs.number }}
      pr_number: ${{ needs.resume.outputs.pr }}
      branch: ${{ needs.resume.outputs.branch }}
      message: ${{ needs.resume.outputs.message }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # The agent job crashed (an install that failed, a timeout). Without this the
  # contributor wrote `@claude` and heard nothing at all. It posts a new comment
  # and does NOT rewrite the status comment, so the download links stay where the
  # contributor already knows to find them.
  failed:
    needs: [allowlist, agent]
    if: ${{ !cancelled() && needs.agent.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.allowlist.outputs.number }}
        run: |
          set -euo pipefail
          gh label create needs-maintainer --force --description "A person has to look at this" || true
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label needs-maintainer
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Something went wrong on my side while I was reading your comment. Nothing is wrong with your report. The earlier download links still work. The maintainer has been told and will look. You do not need to do anything."

  # The branch moved. A push made with the bot's token starts no `pull_request`
  # run, so the checks and the build are started from here, and repaired if red.
  # Only when the branch moved: rebuilding on a question would spend two
  # packaging jobs on a reply.
  verify:
    needs: [allowlist, agent]
    if: needs.agent.outputs.result == 'revised'
    # A ceiling, not a grant: every job inside states its own permissions.
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: write
    uses: ParkingSoman/omniya-core/.github/workflows/pipeline-verify.yml@testing
    with:
      issue_number: ${{ needs.allowlist.outputs.number }}
      pr_number: ${{ needs.agent.outputs.pr }}
      branch: ${{ needs.agent.outputs.branch }}
      message: ${{ needs.agent.outputs.message }}
      reply_state: revised
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # The contributor said it works. This takes the pull request out of draft and
  # asks the maintainer to review it, when the required checks are green. It does
  # not merge: the maintainer merges, and that closes the issue.
  #
  # Other fixes are merged while the contributor tests, so a fix that was clean
  # when it was built may no longer merge. `--check-conflicts` asks, and when it
  # does conflict it starts `pipeline-conflicts.yml` for this one pull request
  # instead of handing the maintainer a merge to do. That run calls the hand-off
  # again once the branch is repaired and the checks are green. For that the job
  # holds `actions: write`. It runs no agent, which is the rule for any job that
  # may start a workflow.
  handoff:
    needs: [allowlist, agent]
    if: needs.agent.outputs.result == 'approved'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: write
      issues: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.allowlist.outputs.number }}
          PR: ${{ needs.agent.outputs.pr }}
        run: node scripts/ci/hand-off.mjs "$ISSUE" "$PR" --check-conflicts
