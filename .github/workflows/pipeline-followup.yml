name: pipeline-followup

# Round two, and every round after it, on the ISSUE.
#
# `pipeline-fix.yml` turns one bug report into one draft pull request, and
# `pipeline-verify.yml` turns that into a checked build with links on the issue.
# If the build is still wrong, the contributor says what, in a comment on the
# SAME issue, and the agent revises the SAME branch. The build behind the
# existing links is replaced.
#
# The contributor never opens the pull request. It is the maintainer's
# material. Everything she reads and writes is on the issue.
#
# Called from the stub on `main` (`.github/pipeline-stubs/contributor-followup.yml`),
# for the same reason as `pipeline-fix.yml`: GitHub starts an `on: issue_comment`
# workflow from the default branch only.
#
# What the agent answers, as one word the jobs below act on:
#
#   revised      it changed the branch   -> verify, and edit the status comment
#   approved     "it works"              -> hand the fix to the maintainer
#   answered     a question               -> nothing more
#   needs-design a request for something new -> nothing more (the agent commented)
#   stopped      it could not go on       -> nothing more (the agent commented)
#   (a crash)    the agent job failed     -> `failed` tells the contributor
on:
  workflow_call:
    # Only the subscription token, and the stub passes only that. Not every
    # secret in the repository, and not `inherit`.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

# One run per issue, and the SAME group as `pipeline-fix.yml`, so a comment that
# arrives while a fix or a repair is running waits for it. They push to the same
# branch. Queued rather than cancelled, for a sharper reason than on the first
# round: a killed run can leave half a revision on the branch the contributor is
# downloading builds from.
concurrency:
  group: contributor-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # The gate, and it is doing four separate jobs at once. Read the `if` before
  # the steps: the steps never run for most comments in this repository, and
  # that is the point.
  allowlist:
    # 1. `github.event.issue.pull_request` exists only when the comment is on a
    #    pull request. GitHub sends issue comments and pull request comments
    #    through the same event, and this field is the only thing that tells
    #    them apart. The contributor writes on the ISSUE. A comment on a pull
    #    request is the maintainer's conversation and does not start a run.
    #
    # 2. `@claude` is what makes this cost anything. Without it every "thanks,
    #    I'll test tonight" would spend a run of somebody's subscription. The
    #    cost of the word is that forgetting it looks like being ignored, which
    #    is why the status comment on the issue says it every time.
    #
    # 3. The actor is not a Bot. The status comment and the agent's own comments
    #    are written by `github-actions[bot]`, and one of them quotes `@claude`.
    #    Without this line the status comment would start a run, which would
    #    comment, which would start a run. `isAllowed` in the allowlist script
    #    refuses `*[bot]` too -- this is the same rule said one step earlier, so
    #    the loop is cut before a runner is even claimed.
    #
    # 4. The comment is not one of the pipeline's own. Its status comment and its
    #    notice both tell the contributor to write `@claude`, and both carry a
    #    hidden `<!-- omniya-pipeline-` marker. A bot posts them, so rule 3 already
    #    skips them. But two of them were once posted by hand under the
    #    maintainer's name, which is a person, and each started an agent run that
    #    answered a comment nobody had written. The marker holds whoever posts it.
    #
    # 5. (the steps) There is exactly one open fix for this issue. Found below.
    if: >-
      !github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.comment.body, '@claude') &&
      !contains(github.event.comment.body, '<!-- omniya-pipeline-')
    runs-on: ubuntu-latest
    # Least privilege. This job only reads the allowlist and the pull request
    # list. It runs no agent and writes nothing.
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
      number: ${{ steps.issue.outputs.number }}
      count: ${{ steps.find.outputs.count }}
      pr: ${{ steps.find.outputs.pr }}
      branch: ${{ steps.find.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
      - id: issue
        env:
          # Safe to interpolate: GitHub guarantees the issue number is an
          # integer. Nothing else from the event is.
          NUMBER: ${{ github.event.issue.number }}
        run: echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
      - id: check
        # Through `env`, never straight into the command line, and deliberately
        # before any `npm ci`: the decision about whether to spend somebody's
        # subscription quota should not wait on an install that can fail.
        # `|| true` is on the step, not on the decision -- the script exits
        # non-zero to refuse and carries the refusal in the `allowed` output, so
        # a stranger commenting does not paint the Actions tab red.
        env:
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        run: node scripts/ci/allowlist.mjs "$COMMENT_AUTHOR" --github || true
      # Which pull request is this issue's fix? The default checkout is `main`,
      # which does not have the helper, so it comes out of `testing`.
      - id: find
        if: steps.check.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin testing
          mkdir -p "$RUNNER_TEMP/find"
          for f in gh.mjs find-fix-pr.mjs; do
            git show "origin/testing:scripts/ci/$f" > "$RUNNER_TEMP/find/$f"
          done
          node "$RUNNER_TEMP/find/find-fix-pr.mjs" "$ISSUE_NUMBER"

  # A listed contributor wrote `@claude` and there is no fix to continue. Say so.
  # Silence is the failure this repository has already had once.
  nofix:
    needs: allowlist
    if: needs.allowlist.outputs.allowed == 'true' && needs.allowlist.outputs.count != '1'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.allowlist.outputs.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Thank you for the comment. I did not start, because I could not find exactly one fix in progress for this report. The maintainer will read your comment."

  agent:
    needs: allowlist
    if: needs.allowlist.outputs.allowed == 'true' && needs.allowlist.outputs.count == '1'
    # Without `actions`: the agent runs unrestricted Bash. Starting the checks
    # is the `verify` job below, which runs no agent.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ParkingSoman/omniya-core/.github/workflows/pipeline-agent.yml@testing
    with:
      mode: comment
      issue_number: ${{ needs.allowlist.outputs.number }}
      pr_number: ${{ needs.allowlist.outputs.pr }}
      branch: ${{ needs.allowlist.outputs.branch }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # The agent job crashed (an install that failed, a timeout). Without this the
  # contributor wrote `@claude` and heard nothing at all. It posts a new comment
  # and does NOT rewrite the status comment, so the download links stay where the
  # contributor already knows to find them.
  failed:
    needs: [allowlist, agent]
    if: ${{ !cancelled() && needs.agent.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.allowlist.outputs.number }}
        run: |
          set -euo pipefail
          gh label create needs-maintainer --force --description "A person has to look at this" || true
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label needs-maintainer
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Something went wrong on my side while I was reading your comment. Nothing is wrong with your report. The earlier download links still work. The maintainer has been told and will look. You do not need to do anything."

  # The branch moved. A push made with the bot's token starts no `pull_request`
  # run, so the checks and the build are started from here, and repaired if red.
  # Only when the branch moved: rebuilding on a question would spend two
  # packaging jobs on a reply.
  verify:
    needs: [allowlist, agent]
    if: needs.agent.outputs.result == 'revised'
    # A ceiling, not a grant: every job inside states its own permissions.
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: write
    uses: ParkingSoman/omniya-core/.github/workflows/pipeline-verify.yml@testing
    with:
      issue_number: ${{ needs.allowlist.outputs.number }}
      pr_number: ${{ needs.agent.outputs.pr }}
      branch: ${{ needs.agent.outputs.branch }}
      status_before: revising
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # The contributor said it works. This takes the pull request out of draft and
  # asks the maintainer to review it, when the required checks are green. It does
  # not merge: the maintainer merges, and that closes the issue.
  handoff:
    needs: [allowlist, agent]
    if: needs.agent.outputs.result == 'approved'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.allowlist.outputs.number }}
          PR: ${{ needs.agent.outputs.pr }}
        run: node scripts/ci/hand-off.mjs "$ISSUE" "$PR"
