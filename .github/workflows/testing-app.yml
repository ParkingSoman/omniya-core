name: testing-app

on:
  push:
    branches: [testing]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: brew install liblouis
      - run: npm ci
      - run: npm run version:bump
      - run: npm run dist:mac
      - name: Write version manifest
        run: |
          node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); fs.writeFileSync('dist/version.json', JSON.stringify({version: pkg.version}))"
      - name: Publish zip + version manifest to testing-app prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view testing-app >/dev/null 2>&1 || gh release create testing-app --prerelease --title "Testing alpha (unsigned)" --notes "Rolling unsigned builds for the testing branch. Windows installs auto-update in the background; macOS testers get an in-app notice to re-download. Apple Silicon Mac and Windows x64 only." --target "$GITHUB_SHA"
          git tag -f testing-app "$GITHUB_SHA"
          git push origin testing-app --force
          gh release upload testing-app dist/*.zip dist/version.json --clobber

  pack-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run version:bump
      - run: npm run dist:win
      - name: Publish installer + update metadata to testing-app prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release view testing-app >$null 2>&1; if ($LASTEXITCODE -ne 0) { gh release create testing-app --prerelease --title "Testing alpha (unsigned)" --notes "Rolling unsigned builds for the testing branch. Windows installs auto-update in the background; macOS testers get an in-app notice to re-download. Apple Silicon Mac and Windows x64 only." --target $env:GITHUB_SHA }
          git tag -f testing-app $env:GITHUB_SHA
          git push origin testing-app --force
          # Top-level dist\* only (no -Recurse): dist\win-unpacked holds the NSIS
          # target's intermediate build (bundled liblouis/elevate helpers, the raw
          # unpacked app exe) which must never be uploaded as if it were a release asset.
          # alpha.yml (not the literal "latest.yml", and not a *.yml wildcard - that
          # also matches electron-builder's own builder-debug.yml dump) because
          # bump-testing-version.mjs always tags testing builds with the "alpha"
          # prerelease channel, so electron-builder names the update-info file
          # alpha.yml specifically.
          $assets = Get-ChildItem -Path "dist\*" -Include *.exe,*.exe.blockmap,alpha.yml
          if (-not $assets) { throw "No installer/update assets found in dist" }
          foreach ($asset in @($assets)) {
            gh release upload testing-app $asset.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed for $($asset.FullName)" }
          }
