name: pipeline-fix

# An alpha contributor files a bug report. An agent reproduces it, writes a
# failing test, fixes it, and opens a DRAFT pull request against `testing`. The
# pipeline then checks and builds it, repairs it until the checks pass, and says
# on the issue that a test build is ready. Nobody couriers anything, and the
# contributor never leaves the issue.
#
# There are four kinds of report, told apart by the label the form put on the
# issue (`scripts/ci/issue-kind.mjs`). A bug and a missing Nemeth symbol go to the
# agent. A design idea and anything else do not: a person answers those, and no
# subscription quota is spent.
#
# THE ISSUE GETS ONE COMMENT PER EVENT, AND THE PIPELINE WRITES IT. The agent
# posts nothing. It leaves its words in a file, `pipeline-agent.yml` returns them
# as the `message` output, and `scripts/ci/reply.mjs` puts them inside the one
# comment the event gets. See that script for why.
#
# This file holds its own triggers. `testing` is the default branch, so GitHub
# starts an `on: issues` run from this copy, and a change to the prompt, the
# tools or the gates reaches the next run the moment it merges.
on:
  issues:
    types: [opened]
  # Run it by hand for an issue that was missed: Actions tab, `pipeline-fix`,
  # "Run workflow", type the issue number. It is gated like an automatic run: the
  # allowlist checks the AUTHOR OF THE ISSUE, not the person who pressed the
  # button, so this cannot make an unlisted stranger's report spend the
  # maintainer's quota.
  workflow_dispatch:
    inputs:
      issue_number:
        description: Number of the issue to work on
        required: true
        type: string

# One run per issue, and the SAME group as `pipeline-followup.yml`. These runs
# spend the maintainer's own Claude subscription quota, and a comment that
# arrives during a fix must wait for it rather than push to the same branch in
# parallel. Queued rather than cancelled: a half-finished fix that is killed
# leaves a branch nobody asked for. (GitHub keeps one waiting run per group, so
# of several comments that arrive during one run, only the newest is kept. It
# reads the whole thread, so nothing the earlier ones said is lost.)
concurrency:
  group: contributor-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # The gate. Nothing else in this file runs without it, and it deliberately
  # comes before any `npm ci`: the decision about whether to spend somebody's
  # subscription quota should not wait on an install that can fail or be slow.
  allowlist:
    runs-on: ubuntu-latest
    # Least privilege. This job only reads the allowlist and, for a hand-started
    # run, the issue. It runs no agent and writes nothing.
    permissions:
      contents: read
      issues: read
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
      number: ${{ steps.issue.outputs.number }}
      author: ${{ steps.issue.outputs.author }}
      access: ${{ steps.access.outputs.access }}
    steps:
      - uses: actions/checkout@v4
      # Work out which issue this run is about and who wrote it. An `issues`
      # event carries both. A hand-started run carries only the number the
      # person typed, so the author is read from GitHub rather than trusted
      # from the form. The number must be digits. A number that is a pull
      # request, or does not exist, yields an empty author, and an empty author
      # is refused by the check below.
      - id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$INPUT_ISSUE_NUMBER" in
              ''|*[!0-9]*) echo "issue_number must be digits, got: $INPUT_ISSUE_NUMBER"; exit 1 ;;
            esac
            number="$INPUT_ISSUE_NUMBER"
            author="$(gh api "repos/$GITHUB_REPOSITORY/issues/$number" --jq 'select(.pull_request == null) | .user.login')"
          else
            number="$EVENT_ISSUE_NUMBER"
            author="$EVENT_ISSUE_AUTHOR"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "author=$author" >> "$GITHUB_OUTPUT"
      - id: check
        # The login goes through `env`, never straight into the command line.
        # A GitHub handle cannot legally contain shell metacharacters, so this
        # is not today's hole -- but the rule that keeps event data out of `run:`
        # is worth keeping unconditionally, because the next person to edit this
        # step will not stop to check which fields are safe.
        #
        # `|| true` is on the step, not on the decision: the script exits
        # non-zero to refuse, and the refusal is carried by the `allowed`
        # output rather than by failing the job. A failed job here would read as
        # a broken pipeline in the Actions tab every time a stranger opens an
        # issue.
        env:
          ISSUE_AUTHOR: ${{ steps.issue.outputs.author }}
        run: node scripts/ci/allowlist.mjs "$ISSUE_AUTHOR" --github || true
      # Being on the list is not enough. `claude-code-action` refuses any actor
      # who cannot write to the repository, and the list and the repository
      # invitation are two separate steps. Issue #33 passed the list, then the
      # action crashed, and the contributor read "something went wrong on my
      # side". Check the same actor the action checks, and say the true reason.
      #
      # `unknown` lets the run go on: the
      # action makes the same check itself.
      - id: access
        if: steps.check.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          node scripts/ci/can-run-agent.mjs "$ACTOR"

  # A listed contributor the agent cannot run for. This is a set-up mistake by the
  # maintainer, not a stranger, so the job FAILS: the failure email is how the
  # maintainer learns, and the comment below says "the maintainer has been told".
  noaccess:
    # Not for a report routed to a person: no agent runs for it, so the contributor
    # having no write access costs nothing and the `routed` comment is the answer.
    needs: [allowlist, kind]
    if: >-
      needs.allowlist.outputs.allowed == 'true' &&
      needs.allowlist.outputs.access == 'false' &&
      needs.kind.outputs.kind != 'routed'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.allowlist.outputs.number }}
          AUTHOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          gh label create needs-owner --force --description "A person has to look at this" || true
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label needs-owner
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Thank you for the report. I did not start, because the maintainer has not finished adding you yet. Nothing is wrong with your report. The maintainer has been told. I will pick this up after that. You do not need to do anything."
          {
            echo "### The fixer did not start on #$ISSUE_NUMBER"
            echo
            echo "$AUTHOR is on the contributor list but cannot write to the repository. The agent action refuses that."
            echo "Run: node scripts/ci/add-contributor.mjs $AUTHOR"
            echo "Then they must accept the invitation. Then run pipeline-fix by hand for issue $ISSUE_NUMBER."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$AUTHOR cannot write to the repository. See the job summary." >&2
          exit 1

  # A refusal that says nothing looks the same as a pipeline that is broken.
  # Issue #22 sat for 23 days because the gate refused its author and nobody
  # was told. This job costs no Claude quota: it posts one comment and stops.
  # Bots are skipped, so a bot-opened issue cannot start a comment exchange.
  refused:
    needs: allowlist
    if: >-
      needs.allowlist.outputs.allowed != 'true' &&
      needs.allowlist.outputs.number != '' &&
      !endsWith(needs.allowlist.outputs.author, '[bot]')
    runs-on: ubuntu-latest
    # Least privilege. This job only posts one comment.
    permissions:
      issues: write
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.allowlist.outputs.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Thank you for the report. The automatic fixer did not start on this issue, because its author is not on the contributor list yet. Nothing is wrong with your report. The maintainer will read it and decide what happens next."

  # Which kind of report is this? Read from the labels the form set. It reads one
  # issue and writes nothing.
  kind:
    needs: allowlist
    if: needs.allowlist.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.kind.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
      - id: kind
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.allowlist.outputs.number }}
        # If the labels cannot be read, treat the report as a bug: the same as an
        # issue with no type label, and what every report was before there were
        # types. The other way is silence, because nothing downstream matches an
        # empty kind and a skipped `fix` is not a failure. Silence is what hid
        # issue #22 for 23 days.
        run: node scripts/ci/issue-kind.mjs "$ISSUE" || echo "kind=bug" >> "$GITHUB_OUTPUT"

  # A design idea, or anything else. A person answers. No agent starts and no
  # quota is spent. One short comment, so it is not read as the pipeline being
  # broken, which is how issue #22 sat for 23 days.
  routed:
    needs: [allowlist, kind]
    if: needs.allowlist.outputs.allowed == 'true' && needs.kind.outputs.kind == 'routed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.allowlist.outputs.number }}
        run: node scripts/ci/reply.mjs "$ISSUE" routed

  # Tell the contributor, on the issue, that work has started. This is the
  # first thing they read. It is a job of its own so the gate stays free of
  # write access, and a failed comment never stops the fix.
  #
  # Everything that is not explicitly `routed` goes to the agent, as a bug. If the
  # `kind` job itself failed, its output is empty, and the only other way is
  # silence, which is what hid issue #22 for 23 days. `!cancelled()` is what lets
  # this run after a failed `kind` job.
  status:
    needs: [allowlist, kind]
    if: >-
      ${{ !cancelled() &&
      needs.allowlist.outputs.allowed == 'true' &&
      needs.allowlist.outputs.access != 'false' &&
      needs.kind.outputs.kind != 'routed' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.allowlist.outputs.number }}
        run: node scripts/ci/reply.mjs "$ISSUE" started

  fix:
    needs: [allowlist, kind, status]
    if: >-
      ${{ !cancelled() &&
      needs.allowlist.outputs.allowed == 'true' &&
      needs.allowlist.outputs.access != 'false' &&
      needs.kind.outputs.kind != 'routed' }}
    # Without `actions`: the agent runs unrestricted Bash. Starting the checks
    # is the `verify` job below, which runs no agent.
    #
    # Without `issues: write` either. The agent posts nothing on the issue, and
    # this is what makes that true rather than requested.
    permissions:
      contents: write
      pull-requests: write
      issues: read
    uses: ./.github/workflows/pipeline-agent.yml
    with:
      mode: fix
      kind: ${{ needs.kind.outputs.kind == 'nemeth' && 'nemeth' || 'bug' }}
      issue_number: ${{ needs.allowlist.outputs.number }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PIPELINE_APP_PRIVATE_KEY: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}

  # The agent ended without a pull request, or crashed. Say so on the issue, so
  # the contributor is not left reading "I started on this" for ever. A report
  # that was not a bug, a question the agent asked, one it could not reproduce,
  # and a run that died (an install that failed, a timeout) all end here. The
  # agent's own words ride in the one comment. `scripts/ci/fix-outcome.mjs`
  # decides which comment and which label, and `pipeline-followup.yml` uses the
  # same script after an answered question.
  #
  # `needs.fix.result` is what catches the crash: a job that failed has no
  # outputs, so the result word is empty and would match none of the others.
  # A skipped `fix` job is not a failure. It is skipped for a refused author, for
  # one the agent cannot run for, and for a report that is routed to a person,
  # and none of those is a fault.
  outcome:
    needs: [allowlist, fix]
    if: >-
      ${{ !cancelled() &&
      needs.allowlist.outputs.allowed == 'true' &&
      needs.allowlist.outputs.access != 'false' &&
      (needs.fix.result == 'failure' ||
      needs.fix.outputs.result == 'asked' ||
      needs.fix.outputs.result == 'needs-design' ||
      needs.fix.outputs.result == 'blocked') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.allowlist.outputs.number }}
          RESULT: ${{ needs.fix.outputs.result }}
          FIX_JOB: ${{ needs.fix.result }}
          # Agent text. It reaches the script through `env` only.
          MESSAGE: ${{ needs.fix.outputs.message }}
        run: node scripts/ci/fix-outcome.mjs "$ISSUE" "$FIX_JOB" "$RESULT"

  # Check the pull request and build it, and repair it until both pass. This is
  # what keeps a red tick away from the contributor. It is its own job so that
  # the jobs that wait on the checks read no untrusted text, and the agent
  # holds no `actions` permission.
  verify:
    needs: [allowlist, fix]
    if: needs.fix.outputs.result == 'opened'
    # A ceiling, not a grant: every job inside states its own permissions.
    permissions:
      actions: read
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/pipeline-verify.yml
    with:
      issue_number: ${{ needs.allowlist.outputs.number }}
      pr_number: ${{ needs.fix.outputs.pr }}
      branch: ${{ needs.fix.outputs.branch }}
      message: ${{ needs.fix.outputs.message }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PIPELINE_APP_PRIVATE_KEY: ${{ secrets.PIPELINE_APP_PRIVATE_KEY }}
