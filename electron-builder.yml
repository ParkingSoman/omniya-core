appId: org.axiya.omniyacore
productName: Omniya Core
extraResources:
  - from: vendor/liblouis
    to: liblouis
mac:
  identity: null
  target:
    - target: zip
      arch:
        - arm64
  category: public.app-category.education
  artifactName: "Omniya-Core-mac-arm64.zip"
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "Omniya-Core-Setup-x64.${ext}"
  publish:
    provider: generic
    url: "https://github.com/ParkingSoman/omniya-core/releases/download/testing-app/"
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
directories:
  output: dist
files:
  - "**/*"
  - "!docs{,/**/*}"
  - "!test{,/**/*}"
  - "!vendor{,/**/*}"
  - "!dist{,/**/*}"
  - "!.github{,/**/*}"
  - "!scripts{,/**/*}"
